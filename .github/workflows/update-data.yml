name: Update nflverse data

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      force_publish:
        description: Republish the current snapshot and site without downloading unchanged source CSVs
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.update.outputs.deploy }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Run updater tests
        run: python -m unittest discover -s tests -v
      - name: Check releases and build snapshots
        id: update
        run: |
          args=(--output-dir _site)
          if [[ "$FORCE_PUBLISH" == "true" ]]; then args+=(--force); fi
          python scripts/update_data.py "${args[@]}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_PUBLISH: ${{ inputs.force_publish }}
      - name: Upload Pages artifact
        if: steps.update.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: needs.build.outputs.deploy == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
